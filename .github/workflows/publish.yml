# Проверки перед публикацией.
#
# До 20.09.2026 проверки запускались руками, и сайт уходил в интернет, даже
# если они падали. Теперь правка попадает на сайт только через этот файл:
# сначала проверки, и лишь потом публикация.
#
# Проверки — те же, что запускаются локально: `bash tools/check-content.sh`
# (разделы, якоря, цены, запрет адреса, JSON-LD, FAQ, офферы) плюс
# `check-behavior.mjs` — настоящий Chrome ходит по поднятому рядом сайту.
# Зависимостей нет: ни npm-пакетов, ни установки браузера.
name: Проверки и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Проверки сайта
    runs-on: ubuntu-latest
    steps:
      # Вся история, а не последний коммит: проверка даты в sitemap смотрит,
      # когда в последний раз правился index.html (`git log -1 -- index.html`).
      # При обычном неглубоком клоне виден только верхний коммит, и датой
      # правки страницы считается он — проверка падала на ровном месте.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Без браузера check-behavior.mjs молча пропускает свою секцию,
      # и половина обещания «сайт проверяет себя» перестала бы работать
      # незаметно. Поэтому отсутствие Chrome — это провал, а не пропуск.
      - name: Chrome на месте
        run: |
          if [ -x /usr/bin/google-chrome ] || [ -x /usr/bin/chromium ]; then
            echo "Chrome найден: $(command -v google-chrome chromium | head -1)"
          else
            echo "На машине сборки нет Chrome — проверки поведения молча пропустились бы." >&2
            exit 1
          fi

      - name: Все проверки
        run: bash tools/check-content.sh

  # Сборка — тем же Jekyll, которым Pages собирал сайт из ветки: он уважает
  # exclude из _config.yml. Собрать иначе (просто выложить папку) значило бы
  # опубликовать docs, tools, JOURNAL.md и README — сейчас они закрыты.
  # Пока это только сборка: посмотреть, что попадёт наружу. Публикация
  # добавляется следующим шагом.
  build:
    name: Сборка сайта
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Что попадёт на сайт
        run: |
          echo "Верхний уровень:"
          ls -A _site
          echo
          for closed in docs tools JOURNAL.md README.md README.en.md; do
            if [ -e "_site/$closed" ]; then
              echo "НАРУЖУ УШЛО ЗАКРЫТОЕ: $closed" >&2
              exit 1
            fi
            echo "закрыто, как и было: $closed"
          done
          for needed in index.html CNAME llms.txt robots.txt sitemap.xml css js fonts img pages; do
            if [ ! -e "_site/$needed" ]; then
              echo "ПОТЕРЯЛОСЬ: $needed" >&2
              exit 1
            fi
          done
          echo "всё нужное на месте"
